# Alembic: migraciones del esquema. Se corre desde backend/:
#   uv run alembic upgrade head
# La URL de la base no va aquí: migraciones/env.py la lee de DATABASE_URL,
# la misma variable que usa la app.

[alembic]
script_location = %(here)s/migraciones
prepend_sys_path = .
path_separator = os
# 2026_11_13_1530-<rev>_<descripcion>.py: ordenadas por fecha en la carpeta.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
timezone = America/Bogota

# Cada migración nueva sale ya formateada con ruff.
[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
