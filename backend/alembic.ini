# Alembic: schema migrations. Run from backend/:
#   uv run alembic upgrade head
# The database URL is not set here: migrations/env.py reads DATABASE_URL,
# the same variable the app uses.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# 0001_users.py: short and sequential. Create each one with
#   uv run alembic revision --autogenerate --rev-id 0002 -m "parades"
file_template = %%(rev)s_%%(slug)s
timezone = America/Bogota

# Every new migration comes out already formatted with ruff.
[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
