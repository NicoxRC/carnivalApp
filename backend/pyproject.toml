[project]
name = "sigue-el-desfile-backend"
version = "0.1.0"
description = "API de Sigue el Desfile (FastAPI + PostgreSQL)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "boto3>=1.44.2",
    "fastapi[standard]>=0.162.5",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "pyproj>=3.8.0",
    "pywebpush>=2.5.0",
    "shapely>=2.2.0",
    "sqlalchemy[asyncio]>=2.1.8",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

# Es una aplicación, no una librería: se corre, no se instala.
[tool.uv]
package = false

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errores básicos · I: orden de imports · UP: sintaxis moderna
# B: bugs comunes · FAST: reglas propias de FastAPI
select = ["E", "F", "I", "UP", "B", "FAST"]

[tool.mypy]
python_version = "3.12"
strict = true
