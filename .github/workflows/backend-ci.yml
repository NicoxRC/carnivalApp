name: Backend

# The same checks docs/backend/PLAN.md asks for before opening a PR, with the
# flake's tools: "works on my machine" and "works in CI" mean the same thing.
#
# Only runs when the PR touches the backend or its environment. Each job is a
# check with its own name; on the PR they show up as "Backend / pytest".
on:
  pull_request:
    branches: [trunk]
    paths:
      - "backend/**"
      - "flake.nix"
      - "flake.lock"
      - ".pre-commit-config.yaml"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

# A new push to the same PR cancels the previous run.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - run: nix develop -c pre-commit run --all-files

  # The gitleaks hook looks at what is staged, and in CI nothing is: here
  # the commits the PR brings are scanned.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, to compare against the base branch.
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: nix develop -c gitleaks git --log-opts="origin/$BASE_BRANCH..HEAD" --redact --no-banner --verbose

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - run: nix develop -c bash -c "cd backend && uv sync --frozen && uv run pytest"
