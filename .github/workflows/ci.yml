name: CI

# Los mismos chequeos que pide docs/CONTRIBUTING.md antes de abrir un PR.
on:
  pull_request:
  push:
    branches: [trunk]

jobs:
  chequeos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
