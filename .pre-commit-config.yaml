# Checks that run on every `git commit` (and in CI with `--all-files`).
# Enable them once per clone: nix develop -c pre-commit install
#
# Almost all are local hooks: they use the tools from the flake and uv.lock,
# so the version is the same on every machine and in CI. That is why commits
# have to be made from `nix develop` (or with direnv).

# Third-party skills (version pinned in skills-lock.json) and the exported
# design: not edited by hand.
exclude: ^(\.agents/|design/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # In Markdown, two trailing spaces are a line break.
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (backend)
        entry: uv run --project backend ruff check --fix --force-exclude
        language: system
        files: ^backend/
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format (backend)
        entry: uv run --project backend ruff format --force-exclude
        language: system
        files: ^backend/
        types_or: [python, pyi]

      - id: mypy
        name: mypy --strict (backend/app)
        # mypy needs to see the whole package, not just the files in the commit.
        entry: bash -c 'cd backend && uv run mypy --strict app'
        language: system
        files: ^backend/app/
        types_or: [python, pyi]
        pass_filenames: false

      - id: gitleaks
        name: gitleaks (secrets in what is being committed)
        entry: gitleaks git --pre-commit --staged --redact --no-banner --verbose
        language: system
        pass_filenames: false

      - id: nixfmt
        name: nixfmt
        entry: nixfmt
        language: system
        files: \.nix$

      - id: sops-encrypted
        name: secrets/ encrypted with sops
        entry: scripts/check-sops.sh
        language: script
        files: ^secrets/
        exclude: ^secrets/README\.md$

      - id: terraform-fmt
        name: terraform fmt
        entry: terraform fmt -check -diff
        language: system
        files: ^infra/.*\.(tf|tfvars)$
