# Which key encrypts each file in secrets/. See secrets/README.md.
#
# The keys here are public (age1…): they can only encrypt. Each person's
# private key lives in ~/.config/sops/age/keys.txt and never enters the repo.
creation_rules:
  - path_regex: ^secrets/dev\.enc\.yaml$
    age: age1hypnc854yxq3mc2cadwlyt6pye9mg2m7dlu36szjyq0l3ua5v5hsgs055c

  - path_regex: ^secrets/prod\.enc\.yaml$
    age: age1hypnc854yxq3mc2cadwlyt6pye9mg2m7dlu36szjyq0l3ua5v5hsgs055c
